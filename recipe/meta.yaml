{% set name = "dejaq" %}
{% set version = "1.1.0" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/{{ name[0] }}/{{ name }}/dejaq-{{ version }}.tar.gz
  sha256: a6fffdc5577f6530a466250547cb2a1ac7c5b6277dabf360cbabf7ab4364bf8e

build:
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  number: 0

requirements:
  host:
    - python {{ python_min }}.*
    - setuptools >=42
    - wheel
    - pip
  run:
    - python >={{ python_min }}
    - numpy
    - tqdm
    - __unix     # [unix]
    - posix_ipc  # [unix]
    - __win      # [win]
    - cloudpickle
    - psutil

test:
  imports:
    - dejaq
  commands:
    - pip check
  requires:
    - python {{ python_min }}.*
    - pip

about:
  home: https://github.com/danionella/dejaq
  summary: Déjà Queue – A fast multiprocessing queue for Python
  license: MIT
  license_file: LICENSE.md

extra:
  recipe-maintainers:
    - bjudkewitz
